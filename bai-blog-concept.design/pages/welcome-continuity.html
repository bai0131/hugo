<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页 · 原站延续版</title>
    <style id="theme-vars">
:root {
  --bai-background: #0d0f12;
  --bai-foreground: #f2eee8;
  --bai-card: #16191e;
  --bai-card-foreground: #f2eee8;
  --bai-popover: #1b1f25;
  --bai-popover-foreground: #f2eee8;
  --bai-primary: #e98b4a;
  --bai-primary-foreground: #160d08;
  --bai-muted: #20242a;
  --bai-muted-foreground: #a9a39b;
  --bai-border: rgba(242, 238, 232, 0.12);
  --bai-input: #20242a;
  --bai-ring: #e98b4a;
  --bai-radius-sm: 4px;
  --bai-radius-md: 8px;
  --bai-radius-lg: 16px;
  --bai-surface-2: #20242a;
  --bai-ink-3: #746f69;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--bai-background);
    --color-foreground: var(--bai-foreground);
    --color-card: var(--bai-card);
    --color-card-foreground: var(--bai-card-foreground);
    --color-popover: var(--bai-popover);
    --color-popover-foreground: var(--bai-popover-foreground);
    --color-primary: var(--bai-primary);
    --color-primary-foreground: var(--bai-primary-foreground);
    --color-muted: var(--bai-muted);
    --color-muted-foreground: var(--bai-muted-foreground);
    --color-border: var(--bai-border);
    --color-input: var(--bai-input);
    --color-ring: var(--bai-ring);
    --radius-sm: var(--bai-radius-sm);
    --radius-md: var(--bai-radius-md);
    --radius-lg: var(--bai-radius-lg);
  }
  @layer base {
    body { background: var(--bai-background); color: var(--bai-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--bai-background); }
      .text-background { color: var(--bai-background); }
      .border-background { border-color: var(--bai-background); }
      .ring-background { --tw-ring-color: var(--bai-background); }
      .bg-foreground { background-color: var(--bai-foreground); }
      .text-foreground { color: var(--bai-foreground); }
      .border-foreground { border-color: var(--bai-foreground); }
      .ring-foreground { --tw-ring-color: var(--bai-foreground); }
      .bg-card { background-color: var(--bai-card); }
      .text-card { color: var(--bai-card); }
      .border-card { border-color: var(--bai-card); }
      .ring-card { --tw-ring-color: var(--bai-card); }
      .bg-card-foreground { background-color: var(--bai-card-foreground); }
      .text-card-foreground { color: var(--bai-card-foreground); }
      .border-card-foreground { border-color: var(--bai-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--bai-card-foreground); }
      .bg-popover { background-color: var(--bai-popover); }
      .text-popover { color: var(--bai-popover); }
      .border-popover { border-color: var(--bai-popover); }
      .ring-popover { --tw-ring-color: var(--bai-popover); }
      .bg-popover-foreground { background-color: var(--bai-popover-foreground); }
      .text-popover-foreground { color: var(--bai-popover-foreground); }
      .border-popover-foreground { border-color: var(--bai-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--bai-popover-foreground); }
      .bg-primary { background-color: var(--bai-primary); }
      .text-primary { color: var(--bai-primary); }
      .border-primary { border-color: var(--bai-primary); }
      .ring-primary { --tw-ring-color: var(--bai-primary); }
      .bg-primary-foreground { background-color: var(--bai-primary-foreground); }
      .text-primary-foreground { color: var(--bai-primary-foreground); }
      .border-primary-foreground { border-color: var(--bai-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--bai-primary-foreground); }
      .bg-muted { background-color: var(--bai-muted); }
      .text-muted { color: var(--bai-muted); }
      .border-muted { border-color: var(--bai-muted); }
      .ring-muted { --tw-ring-color: var(--bai-muted); }
      .bg-muted-foreground { background-color: var(--bai-muted-foreground); }
      .text-muted-foreground { color: var(--bai-muted-foreground); }
      .border-muted-foreground { border-color: var(--bai-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--bai-muted-foreground); }
      .bg-border { background-color: var(--bai-border); }
      .text-border { color: var(--bai-border); }
      .border-border { border-color: var(--bai-border); }
      .ring-border { --tw-ring-color: var(--bai-border); }
      .bg-input { background-color: var(--bai-input); }
      .text-input { color: var(--bai-input); }
      .border-input { border-color: var(--bai-input); }
      .ring-input { --tw-ring-color: var(--bai-input); }
      .bg-ring { background-color: var(--bai-ring); }
      .text-ring { color: var(--bai-ring); }
      .border-ring { border-color: var(--bai-ring); }
      .ring-ring { --tw-ring-color: var(--bai-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <main id="bai-welcome" class="welcome" aria-labelledby="bai-title">
    <section id="bai-profile" class="profile" aria-label="Bai 的欢迎页">
      <img id="bai-avatar" class="avatar" src="../assets/tx.jpg" alt="Bai 的头像">
      <h1 id="bai-title">Bai</h1>
      <p id="bai-signature" class="signature">你说你会哭，不是因为在乎.</p>
      <nav id="bai-social" class="social" aria-label="社交链接">
        <a href="#github" aria-label="GitHub"><i data-lucide="github" aria-hidden="true"></i></a>
        <a href="#music" aria-label="音乐"><i data-lucide="music-2" aria-hidden="true"></i></a>
        <a href="mailto:bai@example.com" aria-label="电子邮件"><i data-lucide="mail" aria-hidden="true"></i></a>
      </nav>
      <a id="bai-enter" class="enter" href="#home">Enter</a>
    </section>
  </main>

  <style id="critical-layout">
    * { box-sizing: border-box; }
    html { min-width: 320px; background: #151412; }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: #fffaf2;
      background: #151412 url('../assets/bg.webp') center / cover fixed no-repeat;
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, .4);
    }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: rgba(244, 162, 97, .18); }
    .welcome {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(30px, 6vh, 64px) 24px;
    }
    .profile {
      width: min(100%, 560px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 20px 28px;
      background: rgba(0, 0, 0, .08);
      text-shadow: 0 2px 16px rgba(0, 0, 0, .66);
    }
    .avatar {
      width: clamp(132px, 14vw, 144px);
      height: clamp(132px, 14vw, 144px);
      display: block;
      object-fit: cover;
      border: 2px solid rgba(255, 250, 242, .78);
      border-radius: 50%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .3);
    }
    h1 {
      margin: 22px 0 0;
      font-size: clamp(40px, 4.4vw, 44px);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: .055em;
    }
    .signature {
      margin: 14px 0 0;
      font-size: clamp(18px, 2.1vw, 21px);
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: .035em;
    }
    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    .social a {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 250, 242, .9);
      border-radius: 50%;
      transition: color .2s ease, transform .2s ease;
    }
    .social svg { width: 21px; height: 21px; stroke-width: 1.7; }
    .social a:hover { color: #f4a261; transform: translateY(-2px); }
    .enter {
      min-width: 112px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 9px 25px 10px;
      border: 1px solid rgba(255, 250, 242, .72);
      border-radius: 999px;
      background: transparent;
      font-size: 16px;
      line-height: 1;
      letter-spacing: .11em;
      transition: color .2s ease, border-color .2s ease, background-color .2s ease, transform .2s ease;
    }
    .enter:hover {
      color: #f4a261;
      border-color: #f4a261;
      background: rgba(0, 0, 0, .12);
      transform: translateY(-2px);
    }
    :where(.social a, .enter):focus-visible {
      color: #f4a261;
      outline: 2px solid #f4a261;
      outline-offset: 4px;
    }
    :where(.social a, .enter):active { transform: translateY(0); }
    @media (max-width: 600px) {
      body { background-attachment: scroll; }
      .welcome { padding: 26px 18px; }
      .profile { padding: 18px 8px 22px; }
      .avatar { width: 96px; height: 96px; }
      h1 { margin-top: 18px; font-size: 32px; }
      .signature { margin-top: 10px; font-size: 16px; line-height: 1.7; }
      .social { margin-top: 15px; gap: 8px; }
      .social a { width: 46px; height: 46px; }
      .enter { min-height: 46px; margin-top: 14px; padding-inline: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
  <script>if (window.lucide) { lucide.createIcons(); }</script>
</body>
</html>
