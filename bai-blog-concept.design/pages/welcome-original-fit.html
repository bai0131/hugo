  <style id="critical-layout">
    * { box-sizing: border-box; }
    html { min-width: 320px; background: #151412; }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: #fffaf2;
      background: #151412 url('../assets/bg.webp') center / cover fixed no-repeat;
      font-family: 'Noto Serif SC', "Source Han Serif SC", "SongTi SC", "PT Serif", serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      background: rgba(0, 0, 0, .4);
    }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: rgba(244, 162, 97, .18); }
    .welcome {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(30px, 6vh, 64px) 24px;
    }
    .profile {
      width: min(100%, 560px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 20px 28px;
      background: transparent;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .66);
    }
    .avatar {
      width: clamp(132px, 14vw, 144px);
      height: clamp(132px, 14vw, 144px);
      display: block;
      object-fit: cover;
      border: 2px solid rgba(255, 250, 242, .78);
      border-radius: 50%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .3);
    }
    h1 {
      margin: 22px 0 0;
      font-size: clamp(40px, 4.4vw, 44px);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: .055em;
    }
    .signature {
      margin: 14px 0 0;
      font-size: clamp(18px, 2.1vw, 21px);
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: .035em;
    }
    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }
    .social a {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 250, 242, .9);
      border-radius: 50%;
      transition: color .2s ease, transform .2s ease;
    }
    .social svg { width: 26px; height: 26px; }
    .social a:hover { color: #f4a261; transform: translateY(-2px); }
    .enter {
      min-width: 112px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 9px 25px 10px;
      border: 1px solid rgba(255, 250, 242, .72);
      border-radius: 999px;
      background: transparent;
      font-size: 16px;
      line-height: 1;
      letter-spacing: .11em;
      transition: color .2s ease, border-color .2s ease, background-color .2s ease, transform .2s ease;
    }
    .enter:hover {
      color: #f4a261;
      border-color: #f4a261;
      background: rgba(0, 0, 0, .12);
      transform: translateY(-2px);
    }
    :where(.social a, .enter):focus-visible {
      color: #f4a261;
      outline: 2px solid #f4a261;
      outline-offset: 4px;
    }
    :where(.social a, .enter):active { transform: translateY(0); }
    @media (max-width: 600px) {
      body { background-attachment: scroll; }
      .welcome { padding: 26px 18px; }
      .profile { padding: 18px 8px 22px; }
      .avatar { width: 96px; height: 96px; }
      h1 { margin-top: 18px; font-size: 32px; }
      .signature { margin-top: 10px; font-size: 16px; line-height: 1.7; }
      .social { margin-top: 15px; gap: 8px; }
      .social a { width: 46px; height: 46px; }
      .enter { min-height: 46px; margin-top: 14px; padding-inline: 26px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
