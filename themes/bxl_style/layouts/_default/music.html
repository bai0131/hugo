{{ define "main" }}
<div class="music-page-wrapper fade-in">
  <h1 class="posts-stream__title" style="margin-bottom: 24px; font-size: 1.6rem;">Music</h1>

  <div id="music-player">
    <!-- 主播放区 -->
    <div class="mp-main">
      <!-- 封面 -->
      <div class="mp-cover-wrap">
        <img id="mp-cover" src="" alt="cover" class="mp-cover-img" />
      </div>

      <!-- 右侧：信息 + 歌词 + 控制 -->
      <div class="mp-right">
        <div class="mp-meta">
          <span id="mp-title" class="mp-title">加载中…</span>
          <span id="mp-artist" class="mp-artist"></span>
        </div>

        <!-- 歌词区 -->
        <div class="mp-lrc-wrap" id="mp-lrc-wrap">
          <div class="mp-lrc-inner" id="mp-lrc-inner">
            <p class="mp-lrc-placeholder">♪ 加载歌词中…</p>
          </div>
        </div>

        <!-- 进度条 -->
        <div class="mp-progress-wrap">
          <span id="mp-time-cur" class="mp-time">0:00</span>
          <div class="mp-progress-bar" id="mp-progress-bar">
            <div class="mp-progress-loaded" id="mp-progress-loaded"></div>
            <div class="mp-progress-played" id="mp-progress-played"></div>
            <div class="mp-progress-thumb" id="mp-progress-thumb"></div>
          </div>
          <span id="mp-time-total" class="mp-time">0:00</span>
        </div>

        <!-- 控制按钮 -->
        <div class="mp-controls">
          <button class="mp-ctrl-btn" id="mp-prev" title="上一首">
            <svg viewBox="0 0 24 24"><polygon points="19,20 9,12 19,4" fill="currentColor"/><rect x="5" y="4" width="2" height="16" fill="currentColor"/></svg>
          </button>
          <button class="mp-ctrl-btn mp-ctrl-play-row" id="mp-playbtn2" aria-label="播放/暂停">
            <svg id="mp-play-icon2" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21" fill="currentColor"/></svg>
            <svg id="mp-pause-icon2" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18" fill="currentColor"/><rect x="15" y="3" width="4" height="18" fill="currentColor"/></svg>
          </button>
          <button class="mp-ctrl-btn" id="mp-next" title="下一首">
            <svg viewBox="0 0 24 24"><polygon points="5,4 15,12 5,20" fill="currentColor"/><rect x="17" y="4" width="2" height="16" fill="currentColor"/></svg>
          </button>
          <button class="mp-ctrl-btn mp-vol-btn" id="mp-vol-btn" title="音量">
            <svg id="mp-vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" fill="currentColor"/></svg>
          </button>
          <input type="range" class="mp-vol-slider" id="mp-vol-slider" min="0" max="100" value="80" />
          <button class="mp-ctrl-btn mp-order-btn" id="mp-order-btn" title="随机">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 8.46 20 10.5V4h-5.5zm0.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 播放列表 -->
    <div class="mp-playlist" id="mp-playlist">
      <div class="mp-playlist-header">播放列表 <span id="mp-pl-count"></span></div>
      <ol class="mp-playlist-list" id="mp-playlist-list"></ol>
    </div>
  </div>
</div>

<audio id="mp-audio" preload="none"></audio>

<style>
/* ── 自定义播放器样式 ── */
#music-player {
  max-width: 800px;
  margin: 0 auto;
  background: #EBE7DF;
  border: 1px solid #D9D2C5;
  border-radius: 16px;
  overflow: hidden;
  font-family: 'Source Han Serif SC', 'Noto Serif SC', 'Songti SC', serif;
  box-shadow: 0 8px 32px rgba(0,0,0,0.07);
}

/* 主播放区 */
.mp-main {
  display: flex;
  flex-direction: row;
  gap: 0;
  padding: 24px 24px 16px;
  align-items: flex-start;
}

/* 封面 */
.mp-cover-wrap {
  position: relative;
  width: 140px;
  height: 140px;
  flex-shrink: 0;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  margin-right: 24px;
}
.mp-cover-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}
.mp-cover-wrap:hover .mp-cover-img {
  transform: scale(1.04);
}

/* 播放按钮（在封面上） */
.mp-play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(0,0,0,0.58);
  border: 2px solid rgba(255,255,255,0.88);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
  padding: 0;
  outline: none;
}
.mp-play-btn:hover {
  background: #C8654B;
  border-color: #C8654B;
  transform: translate(-50%, -50%) scale(1.08);
}
.mp-play-btn svg {
  width: 20px;
  height: 20px;
  display: block;
  flex-shrink: 0;
}

/* 右侧区域 */
.mp-right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* 歌曲信息 */
.mp-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-bottom: 8px;
  border-bottom: 1px solid #DFD9CE;
}
.mp-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: #111;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mp-artist {
  font-size: 0.9rem;
  color: #888;
}

/* 歌词区 */
.mp-lrc-wrap {
  height: 160px;
  overflow: hidden;
  position: relative;
  text-align: center;
}
.mp-lrc-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform 0.4s ease;
}
.mp-lrc-inner p {
  font-size: 1rem;
  color: #888;
  line-height: 2;
  margin: 0;
  padding: 0;
  transition: color 0.3s, font-size 0.3s, font-weight 0.3s, opacity 0.3s;
  opacity: 0.55;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.mp-lrc-inner p.lrc-active {
  color: #C8654B;
  font-size: 1.1rem;
  font-weight: 700;
  opacity: 1;
}
.mp-lrc-placeholder {
  color: #aaa;
  font-size: 0.95rem;
  line-height: 160px;
  margin: 0;
}

/* 进度条 */
.mp-progress-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mp-time {
  font-size: 0.78rem;
  color: #888;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  min-width: 32px;
}
.mp-progress-bar {
  flex: 1;
  height: 4px;
  background: #D8D1C3;
  border-radius: 4px;
  position: relative;
  cursor: pointer;
}
.mp-progress-bar:hover {
  height: 6px;
}
.mp-progress-loaded {
  position: absolute;
  left: 0; top: 0;
  height: 100%;
  background: #C8C2B5;
  border-radius: 4px;
  width: 0;
  transition: width 0.3s;
}
.mp-progress-played {
  position: absolute;
  left: 0; top: 0;
  height: 100%;
  background: #C8654B;
  border-radius: 4px;
  width: 0;
}
.mp-progress-thumb {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #C8654B;
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  left: 0;
  transition: left 0s;
}

/* 控制按钮行 */
.mp-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mp-ctrl-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  transition: color 0.2s, background 0.2s;
  padding: 0;
}
.mp-ctrl-btn svg {
  width: 18px;
  height: 18px;
}
.mp-ctrl-btn:hover {
  color: #C8654B;
  background: rgba(200,101,75,0.09);
}
.mp-ctrl-play-row {
  width: 38px;
  height: 38px;
  background: #C8654B;
  color: white;
  border-radius: 50%;
}
.mp-ctrl-play-row:hover {
  background: #b85840;
  color: white;
}
.mp-ctrl-play-row svg {
  width: 16px;
  height: 16px;
}
.mp-vol-btn { margin-left: 4px; }
.mp-vol-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 70px;
  height: 4px;
  border-radius: 4px;
  background: #D8D1C3;
  outline: none;
  cursor: pointer;
}
.mp-vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #C8654B;
  cursor: pointer;
}
.mp-order-btn { margin-left: 2px; }
.mp-order-btn.active { color: #C8654B; }

/* 播放列表 */
.mp-playlist {
  border-top: 1px solid #DFD9CE;
  background: #F4F1EA;
  max-height: 200px;
  overflow-y: auto;
}
.mp-playlist-header {
  font-size: 0.82rem;
  color: #888;
  padding: 8px 20px;
  border-bottom: 1px solid #E6E0D4;
  position: sticky;
  top: 0;
  background: #F4F1EA;
  z-index: 1;
}
.mp-playlist-list {
  margin: 0;
  padding: 0;
  list-style: none;
}
.mp-playlist-list li {
  display: flex;
  align-items: center;
  padding: 0 20px;
  height: 44px;
  cursor: pointer;
  border-bottom: 1px solid #EDE7DC;
  transition: background 0.15s;
  gap: 12px;
  color: #333;
  font-size: 0.92rem;
}
.mp-playlist-list li:hover { background: rgba(200,101,75,0.07); }
.mp-playlist-list li.pl-active {
  background: rgba(200,101,75,0.12);
  color: #C8654B;
  font-weight: 700;
}
.pl-index {
  color: #bbb;
  font-size: 0.78rem;
  min-width: 20px;
  text-align: right;
}
.pl-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-artist { color: #aaa; font-size: 0.82rem; white-space: nowrap; }
.pl-active .pl-index { color: #C8654B; }
.pl-active .pl-artist { color: #C8654B; opacity: 0.7; }

/* 滚动条 */
.mp-playlist::-webkit-scrollbar { width: 4px; }
.mp-playlist::-webkit-scrollbar-track { background: #F4F1EA; }
.mp-playlist::-webkit-scrollbar-thumb { background: #D0C9BD; border-radius: 2px; }
</style>

<script>
(function () {
  var musicList = [
    { name: '那天下雨了',   artist: '周杰伦', url: '/music/bgm1.mp3',  cover: '/music/bgm1.jpg',  lrc: '/music/bgm1.lrc'  },
    { name: '晴天',         artist: '周杰伦', url: '/music/bgm2.mp3',  cover: '/music/bgm2.jpg',  lrc: '/music/bgm2.lrc'  },
    { name: '一路向北',     artist: '周杰伦', url: '/music/bgm3.mp3',  cover: '/music/bgm3.jpg',  lrc: '/music/bgm3.lrc'  },
    { name: '夜曲',         artist: '周杰伦', url: '/music/bgm4.mp3',  cover: '/music/bgm4.jpg',  lrc: '/music/bgm4.lrc'  },
    { name: '发如雪',       artist: '周杰伦', url: '/music/bgm5.mp3',  cover: '/music/bgm5.jpg',  lrc: '/music/bgm5.lrc'  },
    { name: '蒲公英的约定', artist: '周杰伦', url: '/music/bgm6.mp3',  cover: '/music/bgm6.jpg',  lrc: '/music/bgm6.lrc'  },
    { name: '枫',           artist: '周杰伦', url: '/music/bgm7.mp3',  cover: '/music/bgm7.jpg',  lrc: '/music/bgm7.lrc'  },
    { name: '爱你没差',     artist: '周杰伦', url: '/music/bgm8.mp3',  cover: '/music/bgm8.jpg',  lrc: '/music/bgm8.lrc'  },
    { name: '我不配',       artist: '周杰伦', url: '/music/bgm9.mp3',  cover: '/music/bgm9.jpg',  lrc: '/music/bgm9.lrc'  },
    { name: '最长的电影',   artist: '周杰伦', url: '/music/bgm10.mp3', cover: '/music/bgm10.jpg', lrc: '/music/bgm10.lrc' },
    { name: '告白气球',     artist: '周杰伦', url: '/music/bgm11.mp3', cover: '/music/bgm11.jpg', lrc: '/music/bgm11.lrc' },
    { name: '反方向的钟',   artist: '周杰伦', url: '/music/bgm12.mp3', cover: '/music/bgm12.jpg', lrc: '/music/bgm12.lrc' }
  ];

  // 状态
  var currentIndex = 0;
  var isPlaying = false;
  var isShuffle = false;
  var lrcLines = [];   // [{time, text}, ...]
  var lrcNodes = [];
  var activeLrcIdx = -1;
  var isDragging = false;

  // DOM
  var audio      = document.getElementById('mp-audio');
  var cover      = document.getElementById('mp-cover');
  var titleEl    = document.getElementById('mp-title');
  var artistEl   = document.getElementById('mp-artist');
  var lrcInner   = document.getElementById('mp-lrc-inner');
  var playBtn2   = document.getElementById('mp-playbtn2');
  var playIcon2  = document.getElementById('mp-play-icon2');
  var pauseIcon2 = document.getElementById('mp-pause-icon2');
  var prevBtn    = document.getElementById('mp-prev');
  var nextBtn    = document.getElementById('mp-next');
  var progressBar   = document.getElementById('mp-progress-bar');
  var progressPlayed = document.getElementById('mp-progress-played');
  var progressLoaded = document.getElementById('mp-progress-loaded');
  var progressThumb  = document.getElementById('mp-progress-thumb');
  var timeCur    = document.getElementById('mp-time-cur');
  var timeTotal  = document.getElementById('mp-time-total');
  var volSlider  = document.getElementById('mp-vol-slider');
  var orderBtn   = document.getElementById('mp-order-btn');
  var plList     = document.getElementById('mp-playlist-list');
  var plCount    = document.getElementById('mp-pl-count');

  // ── 工具函数 ──
  function fmt(s) {
    s = Math.floor(s) || 0;
    var m = Math.floor(s / 60), sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function setPlayState(playing) {
    isPlaying = playing;
    playIcon2.style.display  = playing ? 'none'  : 'block';
    pauseIcon2.style.display = playing ? 'block' : 'none';
  }

  // ── 歌词解析 ──
  function parseLrc(text) {
    var lines = text.split('\n');
    var result = [];
    var re = /\[(\d+):(\d+\.\d+)\](.*)/;
    lines.forEach(function(line) {
      var m = line.match(re);
      if (m) {
        var t = parseInt(m[1]) * 60 + parseFloat(m[2]);
        result.push({ time: t, text: m[3].trim() });
      }
    });
    result.sort(function(a, b){ return a.time - b.time; });
    return result;
  }

  function renderLrc() {
    lrcInner.innerHTML = '';
    lrcNodes = [];
    activeLrcIdx = -1;
    if (!lrcLines.length) {
      lrcInner.innerHTML = '<p class="mp-lrc-placeholder">暂无歌词</p>';
      return;
    }
    lrcLines.forEach(function(line) {
      var p = document.createElement('p');
      p.textContent = line.text || '♪';
      lrcInner.appendChild(p);
      lrcNodes.push(p);
    });
  }

  var LRC_WRAP_H = 160; // px
  function updateLrc(currentTime) {
    if (!lrcLines.length || !lrcNodes.length) return;
    var idx = -1;
    for (var i = 0; i < lrcLines.length; i++) {
      if (lrcLines[i].time <= currentTime) idx = i;
      else break;
    }
    if (idx === activeLrcIdx) return;
    activeLrcIdx = idx;
    lrcNodes.forEach(function(p, i){
      p.classList.toggle('lrc-active', i === idx);
    });
    // 滚动当前行到中间
    if (idx >= 0) {
      var activeNode = lrcNodes[idx];
      var lineH = activeNode.offsetHeight;
      var offset = activeNode.offsetTop - LRC_WRAP_H / 2 + lineH / 2;
      lrcInner.style.transform = 'translateY(' + (-offset) + 'px)';
    }
  }

  // ── 加载歌曲 ──
  function loadTrack(index, autoplay) {
    var track = musicList[index];
    currentIndex = index;
    cover.src = track.cover;
    titleEl.textContent = track.name;
    artistEl.textContent = track.artist;
    audio.src = track.url;
    audio.volume = volSlider.value / 100;
    progressPlayed.style.width = '0%';
    progressThumb.style.left = '0%';
    timeCur.textContent = '0:00';
    timeTotal.textContent = '0:00';
    lrcLines = [];
    lrcInner.innerHTML = '<p class="mp-lrc-placeholder">♪ 加载歌词中…</p>';
    lrcNodes = [];
    activeLrcIdx = -1;
    lrcInner.style.transform = 'translateY(0)';

    // 高亮播放列表
    var items = plList.querySelectorAll('li');
    items.forEach(function(li, i){ li.classList.toggle('pl-active', i === index); });
    // 滚动列表到当前行
    if (items[index]) items[index].scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    // 加载歌词
    fetch(track.lrc)
      .then(function(r){ return r.text(); })
      .then(function(t){
        lrcLines = parseLrc(t);
        renderLrc();
        if (audio.currentTime) updateLrc(audio.currentTime);
      })
      .catch(function(){
        lrcInner.innerHTML = '<p class="mp-lrc-placeholder">暂无歌词</p>';
      });

    if (autoplay) {
      audio.play().then(function(){ setPlayState(true); }).catch(function(){});
    } else {
      setPlayState(false);
    }
  }

  // ── 播放列表渲染 ──
  function renderPlaylist() {
    plList.innerHTML = '';
    plCount.textContent = '(' + musicList.length + ')';
    musicList.forEach(function(track, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="pl-index">' + (i + 1) + '</span><span class="pl-title">' + track.name + '</span><span class="pl-artist">' + track.artist + '</span>';
      li.addEventListener('click', function(){ loadTrack(i, true); });
      plList.appendChild(li);
    });
  }

  // ── 事件绑定 ──
  function togglePlay() {
    if (isPlaying) { audio.pause(); setPlayState(false); }
    else { audio.play().then(function(){ setPlayState(true); }).catch(function(){}); }
  }
  playBtn2.addEventListener('click', togglePlay);

  prevBtn.addEventListener('click', function(){
    var idx = isShuffle ? Math.floor(Math.random() * musicList.length) : (currentIndex - 1 + musicList.length) % musicList.length;
    loadTrack(idx, isPlaying);
  });
  nextBtn.addEventListener('click', function(){
    var idx = isShuffle ? Math.floor(Math.random() * musicList.length) : (currentIndex + 1) % musicList.length;
    loadTrack(idx, isPlaying);
  });

  audio.addEventListener('ended', function(){
    var idx = isShuffle ? Math.floor(Math.random() * musicList.length) : (currentIndex + 1) % musicList.length;
    loadTrack(idx, true);
  });

  audio.addEventListener('timeupdate', function(){
    if (isDragging) return;
    var cur = audio.currentTime, dur = audio.duration || 0;
    var pct = dur ? (cur / dur * 100) : 0;
    progressPlayed.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    timeCur.textContent = fmt(cur);
    timeTotal.textContent = fmt(dur);
    updateLrc(cur);
  });

  audio.addEventListener('progress', function(){
    if (!audio.duration) return;
    try {
      var end = audio.buffered.end(audio.buffered.length - 1);
      progressLoaded.style.width = (end / audio.duration * 100) + '%';
    } catch(e){}
  });

  audio.addEventListener('durationchange', function(){
    timeTotal.textContent = fmt(audio.duration);
  });

  // 进度条点击/拖拽
  function seekTo(e) {
    var rect = progressBar.getBoundingClientRect();
    var pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    audio.currentTime = pct * (audio.duration || 0);
    progressPlayed.style.width = (pct * 100) + '%';
    progressThumb.style.left = (pct * 100) + '%';
  }
  progressBar.addEventListener('mousedown', function(e){ isDragging = true; seekTo(e); });
  document.addEventListener('mousemove', function(e){ if (isDragging) seekTo(e); });
  document.addEventListener('mouseup', function(){ isDragging = false; });

  // 音量
  volSlider.addEventListener('input', function(){ audio.volume = this.value / 100; });

  // 随机
  orderBtn.addEventListener('click', function(){
    isShuffle = !isShuffle;
    orderBtn.classList.toggle('active', isShuffle);
    orderBtn.title = isShuffle ? '随机（已开启）' : '随机';
  });

  // ── 初始化 ──
  renderPlaylist();
  // 随机打乱顺序
  var startIdx = Math.floor(Math.random() * musicList.length);
  loadTrack(startIdx, false);
})();
</script>
{{ end }}
