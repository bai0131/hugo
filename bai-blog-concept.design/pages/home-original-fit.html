<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容主页 · 原站延续版</title>
    <style id="theme-vars">
:root {
  --bai-background: #0d0f12;
  --bai-foreground: #f2eee8;
  --bai-card: #16191e;
  --bai-card-foreground: #f2eee8;
  --bai-popover: #1b1f25;
  --bai-popover-foreground: #f2eee8;
  --bai-primary: #e98b4a;
  --bai-primary-foreground: #160d08;
  --bai-muted: #20242a;
  --bai-muted-foreground: #a9a39b;
  --bai-border: rgba(242, 238, 232, 0.12);
  --bai-input: #20242a;
  --bai-ring: #e98b4a;
  --bai-radius-sm: 4px;
  --bai-radius-md: 8px;
  --bai-radius-lg: 16px;
  --bai-surface-2: #20242a;
  --bai-ink-3: #746f69;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--bai-background);
    --color-foreground: var(--bai-foreground);
    --color-card: var(--bai-card);
    --color-card-foreground: var(--bai-card-foreground);
    --color-popover: var(--bai-popover);
    --color-popover-foreground: var(--bai-popover-foreground);
    --color-primary: var(--bai-primary);
    --color-primary-foreground: var(--bai-primary-foreground);
    --color-muted: var(--bai-muted);
    --color-muted-foreground: var(--bai-muted-foreground);
    --color-border: var(--bai-border);
    --color-input: var(--bai-input);
    --color-ring: var(--bai-ring);
    --radius-sm: var(--bai-radius-sm);
    --radius-md: var(--bai-radius-md);
    --radius-lg: var(--bai-radius-lg);
  }
  @layer base {
    body { background: var(--bai-background); color: var(--bai-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--bai-background); }
      .text-background { color: var(--bai-background); }
      .border-background { border-color: var(--bai-background); }
      .ring-background { --tw-ring-color: var(--bai-background); }
      .bg-foreground { background-color: var(--bai-foreground); }
      .text-foreground { color: var(--bai-foreground); }
      .border-foreground { border-color: var(--bai-foreground); }
      .ring-foreground { --tw-ring-color: var(--bai-foreground); }
      .bg-card { background-color: var(--bai-card); }
      .text-card { color: var(--bai-card); }
      .border-card { border-color: var(--bai-card); }
      .ring-card { --tw-ring-color: var(--bai-card); }
      .bg-card-foreground { background-color: var(--bai-card-foreground); }
      .text-card-foreground { color: var(--bai-card-foreground); }
      .border-card-foreground { border-color: var(--bai-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--bai-card-foreground); }
      .bg-popover { background-color: var(--bai-popover); }
      .text-popover { color: var(--bai-popover); }
      .border-popover { border-color: var(--bai-popover); }
      .ring-popover { --tw-ring-color: var(--bai-popover); }
      .bg-popover-foreground { background-color: var(--bai-popover-foreground); }
      .text-popover-foreground { color: var(--bai-popover-foreground); }
      .border-popover-foreground { border-color: var(--bai-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--bai-popover-foreground); }
      .bg-primary { background-color: var(--bai-primary); }
      .text-primary { color: var(--bai-primary); }
      .border-primary { border-color: var(--bai-primary); }
      .ring-primary { --tw-ring-color: var(--bai-primary); }
      .bg-primary-foreground { background-color: var(--bai-primary-foreground); }
      .text-primary-foreground { color: var(--bai-primary-foreground); }
      .border-primary-foreground { border-color: var(--bai-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--bai-primary-foreground); }
      .bg-muted { background-color: var(--bai-muted); }
      .text-muted { color: var(--bai-muted); }
      .border-muted { border-color: var(--bai-muted); }
      .ring-muted { --tw-ring-color: var(--bai-muted); }
      .bg-muted-foreground { background-color: var(--bai-muted-foreground); }
      .text-muted-foreground { color: var(--bai-muted-foreground); }
      .border-muted-foreground { border-color: var(--bai-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--bai-muted-foreground); }
      .bg-border { background-color: var(--bai-border); }
      .text-border { color: var(--bai-border); }
      .border-border { border-color: var(--bai-border); }
      .ring-border { --tw-ring-color: var(--bai-border); }
      .bg-input { background-color: var(--bai-input); }
      .text-input { color: var(--bai-input); }
      .border-input { border-color: var(--bai-input); }
      .ring-input { --tw-ring-color: var(--bai-input); }
      .bg-ring { background-color: var(--bai-ring); }
      .text-ring { color: var(--bai-ring); }
      .border-ring { border-color: var(--bai-ring); }
      .ring-ring { --tw-ring-color: var(--bai-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header" id="top">
    <nav class="site-nav" aria-label="主导航">
      <a class="brand" href="#top">Bai's Blog</a>
      <div class="nav-links">
        <a class="active" href="#top" aria-current="page">主页</a><a href="#articles">文章</a><a href="#music">音乐</a><a href="#comments">评论区</a><a href="#about">关于</a>
      </div>
      <button class="menu-button" type="button" aria-label="打开菜单" aria-expanded="false"><span></span><span></span><span></span></button>
    </nav>
  </header>
  <main class="page-shell" id="main-content">
    <section class="profile" id="about" aria-labelledby="profile-name">
      <img class="avatar" src="../assets/tx.jpg" alt="Bai 的头像">
      <h1 id="profile-name">Bai</h1>
      <p>不积跬步，无以至千里。</p>
    </section>
    <section class="music-player soft-panel" id="music" aria-labelledby="track-title">
      <img class="album-cover" src="../assets/bgm1.jpg" alt="当前播放曲目封面">
      <div class="track-info"><small>NOW PLAYING</small><h2 id="track-title">随机播放中</h2><p>静静听一首歌</p></div>
      <button class="play-button" type="button" aria-label="播放"><span aria-hidden="true">▶</span></button>
      <div class="timeline"><div class="progress" role="progressbar" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38"><span></span></div><div class="time"><time>01:16</time><time>03:20</time></div></div>
      <button class="volume-button" type="button" aria-label="音量"><span aria-hidden="true">♪</span></button>
    </section>
    <section class="articles" id="articles" aria-labelledby="articles-title">
      <header class="section-heading"><p>RECENT POSTS</p><h2 id="articles-title">Articles</h2></header>
      <div class="article-list soft-panel">
        <article><a href="#hello-world"><h3>Hello World</h3><time datetime="2026-08-18">2026.08.18</time></a></article>
        <article><a href="#markdown-guide"><h3>Markdown Syntax Guide</h3><time datetime="2026-07-26">2026.07.26</time></a></article>
        <article><a href="#hugo-notes"><h3>Hugo Build Notes</h3><time datetime="2026-06-09">2026.06.09</time></a></article>
        <article><a href="#quiet-night"><h3>A Quiet Night</h3><time datetime="2026-04-21">2026.04.21</time></a></article>
      </div>
    </section>
    <section class="comments" id="comments" aria-labelledby="comments-title">
      <header class="section-heading"><p>LEAVE A MESSAGE</p><h2 id="comments-title">评论区</h2></header>
      <form class="comment-form soft-panel"><label for="comment">写下你的想法</label><textarea id="comment" name="comment" rows="4" placeholder="保持友善，慢慢聊。"></textarea><div class="form-row"><input type="text" aria-label="昵称" placeholder="昵称"><button type="submit">发表评论</button></div></form>
    </section>
  </main>
  <footer class="site-footer"><p>© 2026 Bai's Blog · 保持简单，持续记录。</p><a href="#top">返回顶部</a></footer>
  <style id="critical-layout">
    :root { --accent: #f4a261; --text: #f7f1e8; --muted: rgba(247,241,232,.68); --line: rgba(255,255,255,.14); --panel: transparent; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; min-height: 100vh; overflow-x: hidden; color: var(--text); background: #191512 url("../assets/bg.webp") center / cover fixed no-repeat; font-family: 'Noto Serif SC', "Source Han Serif SC", "SongTi SC", "PT Serif", serif; line-height: 1.7; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: rgba(0,0,0,.4); pointer-events: none; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { color: inherit; font: inherit; }
    button, input, textarea { border-radius: 4px; }
    button { cursor: pointer; }
    img { display: block; max-width: 100%; }
    .skip-link { position: fixed; left: 16px; top: -60px; z-index: 100; padding: 8px 14px; color: #1b120d; background: var(--accent); transition: top .2s ease; }
    .skip-link:focus { top: 12px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .site-header { position: relative; z-index: 10; border-bottom: 1px solid rgba(255,255,255,.1); }
    .site-nav { width: min(1120px, calc(100% - 48px)); min-height: 72px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 36px; }
    .brand { font-size: 19px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
    .nav-links { display: flex; align-items: center; gap: clamp(20px, 3vw, 38px); }
    .nav-links a { position: relative; padding: 23px 0 20px; color: rgba(255,255,255,.78); font-size: 14px; transition: color .2s ease; }
    .nav-links a::after { content: ""; position: absolute; left: 50%; bottom: 14px; width: 0; height: 1px; background: var(--accent); transform: translateX(-50%); transition: width .2s ease; }
    .nav-links a:hover, .nav-links a:focus-visible, .nav-links a.active { color: var(--accent); }
    .nav-links a:hover::after, .nav-links a.active::after { width: 18px; }
    .menu-button { display: none; width: 42px; height: 42px; padding: 10px; border: 1px solid var(--line); background: transparent; }
    .menu-button span { display: block; width: 100%; height: 1px; margin: 4px 0; background: currentColor; }
    .page-shell { width: min(800px, calc(100% - 40px)); margin: 0 auto; }
    .profile { display: flex; flex-direction: column; align-items: center; padding: 50px 0 34px; text-align: center; }
    .avatar { width: 84px; height: 84px; object-fit: cover; border: 2px solid rgba(255,255,255,.82); border-radius: 50%; box-shadow: 0 6px 24px rgba(0,0,0,.22); }
    .profile h1 { margin: 12px 0 0; font-size: 28px; font-weight: 600; line-height: 1.3; }
    .profile p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
    .soft-panel { border: 1px solid rgba(255,255,255,.12); background: transparent; box-shadow: none; }
    .music-player { display: grid; grid-template-columns: 64px minmax(150px, 1fr) 46px minmax(150px, 1.4fr) 38px; align-items: center; gap: 18px; padding: 14px 18px; background: transparent; }
    .album-cover { width: 64px; height: 64px; object-fit: cover; border-radius: 3px; }
    .track-info { min-width: 0; }
    .track-info small, .section-heading p { color: var(--accent); font-size: 10px; letter-spacing: .17em; }
    .track-info h2 { margin: 1px 0 0; overflow: hidden; font-size: 16px; font-weight: 600; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .track-info p { margin: 0; color: var(--muted); font-size: 12px; }
    .play-button, .volume-button { display: grid; place-items: center; border: 1px solid var(--line); background: transparent; transition: color .2s ease, border-color .2s ease, transform .2s ease; }
    .play-button { width: 42px; height: 42px; border-radius: 50%; color: var(--accent); }
    .volume-button { width: 36px; height: 36px; border-radius: 50%; }
    .play-button:hover, .volume-button:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
    .timeline { min-width: 0; }
    .progress { height: 3px; overflow: hidden; background: rgba(255,255,255,.16); }
    .progress span { display: block; width: 38%; height: 100%; background: var(--accent); }
    .time { display: flex; justify-content: space-between; margin-top: 5px; color: var(--muted); font-size: 10px; }
    .section-heading { margin: 58px 0 16px; }
    .section-heading p { margin: 0 0 2px; }
    .section-heading h2 { margin: 0; font-size: 29px; font-weight: 500; }
    .article-list { padding: 2px 22px; background: transparent; }
    .article-list article + article { border-top: 1px solid var(--line); }
    .article-list a { display: flex; align-items: baseline; justify-content: space-between; gap: 26px; padding: 18px 2px; transition: color .2s ease, padding .2s ease; }
    .article-list a:hover, .article-list a:focus-visible { padding-left: 8px; color: var(--accent); }
    .article-list h3 { margin: 0; font-size: 17px; font-weight: 500; }
    .article-list time { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    .comment-form { padding: 22px; background: transparent; }
    .comment-form label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    textarea, input { width: 100%; border: 1px solid var(--line); color: var(--text); background: rgba(255,255,255,.035); }
    textarea { display: block; min-height: 110px; padding: 12px 14px; resize: vertical; }
    input { min-width: 0; padding: 10px 12px; }
    textarea::placeholder, input::placeholder { color: rgba(255,255,255,.44); }
    textarea:focus, input:focus { border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-top: 12px; }
    .form-row button { min-width: 104px; padding: 9px 18px; border: 1px solid var(--accent); color: var(--accent); background: transparent; transition: color .2s ease, background .2s ease; }
    .form-row button:hover, .form-row button:focus-visible { color: #24150c; background: var(--accent); }
    .site-footer { width: min(800px, calc(100% - 40px)); margin: 66px auto 0; min-height: 92px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .site-footer a { transition: color .2s ease; }
    .site-footer a:hover, .site-footer a:focus-visible { color: var(--accent); }
    @media (max-width: 680px) {
      .site-nav { width: min(100% - 32px, 1120px); min-height: 62px; }
      .nav-links { display: none; }
      .menu-button { display: block; }
      .profile { padding-top: 38px; }
      .music-player { grid-template-columns: 56px minmax(0, 1fr) 42px; gap: 12px; padding: 13px; }
      .album-cover { width: 56px; height: 56px; }
      .timeline { grid-column: 1 / 3; }
      .volume-button { grid-column: 3; grid-row: 2; }
      .article-list a { align-items: flex-start; flex-direction: column; gap: 3px; padding-block: 15px; }
      .article-list time { align-self: flex-end; margin-top: -24px; }
      .form-row { grid-template-columns: 1fr; }
      .form-row button { justify-self: end; }
      .site-footer { min-height: 116px; align-items: flex-start; flex-direction: column; justify-content: center; gap: 4px; }
      .site-footer p { margin: 0; }
    }
    @media (max-width: 420px) {
      .page-shell, .site-footer { width: calc(100% - 28px); }
      .article-list { padding-inline: 15px; }
      .article-list time { align-self: auto; margin-top: 0; }
      .comment-form { padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</body>
</html>
